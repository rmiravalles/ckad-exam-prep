apiVersion: v1
kind: Pod
metadata:
  labels:
    run: api-pod
  name: api-pod
  namespace: ckad
spec:
  containers:
  - image: busybox:1.36
    name: api
    command: ["/bin/sh", "-c"]
    args: ["echo 'App name: $APP_NAME, Environment: $APP_ENV, Log level: $LOG_LEVEL, Database host: $DATABASE_HOST'; sleep 3600"]
    envFrom:
      - configMapRef:
          name: api-config
  restartPolicy: Never
