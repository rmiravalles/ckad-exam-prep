apiVersion: v1
kind: Pod
metadata:
  labels:
    run: db-client-volume
  name: db-client-volume
  namespace: ckad
spec:
  containers:
  - image: busybox:1.36
    name: client
    command: ["/bin/sh", "-c"]
    args:
      - |
        printf "Username: "
        cat /etc/db-credentials/username
        printf "\nPassword: "
        cat /etc/db-credentials/password
        printf "\n"
        sleep 3600
    volumeMounts:
      - name: credentials-volume
        mountPath: /etc/db-credentials
        readOnly: true
  volumes:
    - name: credentials-volume
      secret:
        secretName: db-credentials
  restartPolicy: Never
