apiVersion: v1
kind: Pod
metadata:
  labels:
    run: probe-challenge
  name: probe-challenge
  namespace: ckad
spec:
  containers:
  - image: nginx:1.27
    name: web
    ports:
      - containerPort: 80
    startupProbe:
      httpGet:
        path: /
        port: 80
      periodSeconds: 5
      failureThreshold: 12
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 0
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 0
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 2
  restartPolicy: Always
