apiVersion: v1
kind: Pod
metadata:
  labels:
    run: probe-lab
  name: probe-lab
  namespace: ckad
spec:
  containers:
  - image: nginx:1.27
    name: web
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 10
      timeoutSeconds: 2
      failureThreshold: 3
    readinessProbe:
      tcpSocket:
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 2
  restartPolicy: Always
