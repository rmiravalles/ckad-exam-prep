apiVersion: v1
kind: Pod
metadata:
  labels:
    run: resource-lab
  name: resource-lab
  namespace: ckad
spec:
  containers:
  - image: nginx:1.27
    name: application
    resources:
      requests:
        cpu: 200m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
  restartPolicy: Always
