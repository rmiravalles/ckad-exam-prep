apiVersion: v1
kind: Pod
metadata:
  labels:
    run: exam-secret-pod
  name: exam-secret-pod
  namespace: ckad
spec:
  containers:
  - image: busybox:1.36
    name: application
    command: ["/bin/sh", "-c"]
    args:
        - |
          printf "Username: "
          printenv DB_USER
          printf "\nPassword: "
          cat /etc/secrets/password
          printf "\n"
          sleep 3600
    env:
      - name: DB_USER
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: username
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: password
    volumeMounts:
      - name: credentials-volume
        mountPath: /etc/secrets
        readOnly: true
  volumes:
    - name: credentials-volume
      secret:
        secretName: db-credentials
  restartPolicy: Never
