apiVersion: v1
kind: Pod
metadata:
  labels:
    run: db-client
  name: db-client
  namespace: ckad
spec:
  containers:
  - image: busybox:1.36
    name: client
    command: ["/bin/sh", "-c"]
    args: ["printenv; sleep 3600"]
    env:
      - name: DB_USERNAME
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: username
      - name: DB_PASSWORD
        valueFrom:
          secretKeyRef:
            name: db-credentials
            key: password
  restartPolicy: Never
