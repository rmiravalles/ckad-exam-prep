apiVersion: v1
kind: Pod
metadata:
  labels:
    app: resource-challenge
  name: resource-challenge
  namespace: ckad
spec:
  containers:
  - image: nginx:1.27
    name: web
    resources:
      requests:
        cpu: 300m
        memory: 256Mi
      limits:
        cpu: 300m
        memory: 256Mi
  restartPolicy: Always
