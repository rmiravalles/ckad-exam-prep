apiVersion: v1
kind: Pod
metadata:
  labels:
    run: logging-app
  name: logging-app
  namespace: ckad
spec:
  containers:
  - image: busybox:1.36
    name: application
    command: ["sh", "-c"]
    args:
      - |
        while true; do
          echo "$(date) - The application is healthy" >> /var/log/app.log
          sleep 5
        done
    volumeMounts:
      - name: shared-logs
        mountPath: /var/log

  - image: busybox:1.36
    name: log-sidecar
    command: ["sh", "-c"]
    args:
      - |
        while true; do
          echo "Processing logs:"
          tail -n 5 /var/log/app.log 2>/dev/null || true
          sleep 10
        done
    volumeMounts:
      - name: shared-logs
        mountPath: /var/log

  volumes:
    - name: shared-logs
      emptyDir: {}
  restartPolicy: Always
