apiVersion: batch/v1
kind: Job
metadata:
  name: data-processor
  namespace: ckad
spec:
  completions: 4
  parallelism: 2
  backoffLimit: 2
  template:
    spec:
      containers:
      - image: busybox:1.36
        name: processor
        command: ["sh", "-c"]
        args: ["echo 'Processing data...'; sleep 5"]
      restartPolicy: Never
