apiVersion: v1
kind: PersistentVolume
metadata:
  name: assessment-pv
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: manual
  hostPath:
    path: /mnt/data/assessment-pv
    type: DirectoryOrCreate
