apiVersion: batch/v1
kind: CronJob
metadata:
  name: assessment-cronjob
spec:
  schedule: "*/10 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cleanup
            image: busybox:1.36
            command: ["/bin/sh", "-c"]
            args: ["echo 'Cleanup completed'"]
          restartPolicy: Never
