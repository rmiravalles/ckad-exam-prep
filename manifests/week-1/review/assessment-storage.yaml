apiVersion: v1
kind: Pod
metadata:
  name: assessment-storage
  namespace: ckad
spec:
  containers:
    - name: application
      image: busybox:1.36
      command: ["/bin/sh", "-c"]
      args: ["echo 'CKAD assessment completed' >> /data/result.txt; sleep 3600"]
      volumeMounts:
      - mountPath: "/data"
        name: assessment
  volumes:
    - name: assessment
      persistentVolumeClaim:
        claimName: assessment-pvc
