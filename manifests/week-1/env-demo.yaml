apiVersion: v1
kind: Pod
metadata:
  labels:
    run: env-demo
  name: env-demo
  namespace: ckad
spec:
  containers:
  - image: busybox:1.36
    name: env-demo
    command: ["sh", "-c"]
    args:
      - "echo 'Environment: $APP_ENV'; echo 'Version: $APP_VERSION'; echo 'Logging: $LOG_LEVEL'; sleep 3600"
    env:
      - name: APP_ENV
        value: development
      - name: APP_VERSION
        value: 2.0.0
      - name: LOG_LEVEL
        value: debug
  dnsPolicy: ClusterFirst
  restartPolicy: Never
