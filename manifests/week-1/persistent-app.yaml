apiVersion: v1
kind: Pod
metadata:
  name: persistent-app
  namespace: ckad
spec:
  containers:
    - name: application
      image: busybox:1.36
      command: ["sh", "-c"]
      args: ["echo 'This data must survive Pod deletion' > /data/message.txt; sleep 3600"]
      volumeMounts:
        - name: persistent-storage
          mountPath: /data

  volumes:
    - name: persistent-storage
      persistentVolumeClaim:
        claimName: pvc-static
