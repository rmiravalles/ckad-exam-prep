apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: log-agent
  namespace: ckad
spec:
  selector:
    matchLabels:
      app: log-agent
  template:
    metadata:
      labels:
        app: log-agent
    spec:
      containers:
        - name: agent
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ["sleep 3600"]
