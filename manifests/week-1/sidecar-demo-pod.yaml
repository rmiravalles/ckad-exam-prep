apiVersion: v1
kind: Pod
metadata:
  name: sidecar-demo
  namespace: ckad
spec:
  containers:
    - name: application
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            echo "$(date) - Application is running" >> /var/log/app.log
            sleep 5
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log

    - name: log-processor
      image: busybox:1.36
      command: ["sh", "-c"]
      args:
        - |
          while true; do
            echo "Processing logs:"
            tail -n 5 /var/log/app.log 2>/dev/null || true
            sleep 10
          done
      volumeMounts:
        - name: shared-logs
          mountPath: /var/log

  volumes:
    - name: shared-logs
      emptyDir: {}
