apiVersion: batch/v1
kind: Job
metadata:
  name: batch-job
  namespace: ckad
spec:
  completions: 5
  parallelism: 2
  backoffLimit: 3
  template:
    spec:
      containers:
        - name: worker
          image: busybox:1.36
          command: ["sh", "-c"]
          args: ["echo 'Processing task'; sleep 10"]
      restartPolicy: Never
