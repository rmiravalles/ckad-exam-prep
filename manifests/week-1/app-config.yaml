apiVersion: v1
kind: Pod
metadata:
  labels:
    run: application-config
  name: application-config
  namespace: ckad
spec:
  containers:
  - image: busybox:1.36
    name: application
    command: ["sh", "-c"]
    args:
      - 'echo "Application name: $APP_NAME"; echo "Environment: $APP_ENV"; echo "Port: $APP_PORT"; sleep 3600'
    env:
      - name: APP_NAME
        value: customer-api
      - name: APP_ENV
        value: production
      - name: APP_PORT
        value: "8080"
  dnsPolicy: ClusterFirst
  restartPolicy: Never
