apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-cleanup
  namespace: ckad
spec:
  jobTemplate:
    metadata:
      name: data-cleanup
    spec:
      template:
        spec:
          containers:
          - image: busybox:1.36
            name: cleanup
            command: ["sh", "-c"]
            args: ["echo 'fff'; sleep 10"]
          restartPolicy: Never
  schedule: '*/5 * * * *'
  timeZone: "Europe/Madrid"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 1
